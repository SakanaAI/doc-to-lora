[project]
name = "ctx-to-lora"
version = "0.0.1"
authors = [{ name = "Rujikorn Charakorn" }]
description = ""
readme = "README.md"
requires-python = ">= 3.10"
dependencies = [
    "transformers==4.51.3",
    "deepspeed==0.16.7",
    "accelerate==1.6.0",
    "datasets==3.6.0",
    "peft",
    "bitsandbytes",
    "jupyter",
    "matplotlib",
    "hf_transfer",
    "torchmetrics",
    "inflect",
    "pre-commit",
    "tensorboardX",
    "wandb",
    "fasttext-wheel",
    "einops",
    "jaxtyping",
    "liger-kernel",
    "tensorboard",
    "flask",
    "pandas",
    "plotly",
    "rouge-score",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"


[tool.black]
line-length = 89

[tool.pyright]
exclude = [
    "train_outputs",
    "data",
    "generated_tasks",
    "outputs",
    "plots",
    "tmp",
    "wandb",
]
typeCheckingMode = "off"

[tool.ruff]
line-length = 89
